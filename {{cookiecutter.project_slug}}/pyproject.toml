[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
{% if cookiecutter.project_type == "data_science" %}
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
{% elif cookiecutter.project_type == "fastapi" %}
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
{% if cookiecutter.use_docker == "yes" %}
    "asyncpg>=0.29",
{% endif %}
{% elif cookiecutter.project_type == "django" %}
    "django>=5.1",
{% if cookiecutter.django_flavor == "drf" %}
    "djangorestframework>=3.15",
{% elif cookiecutter.django_flavor == "ninja" %}
    "django-ninja>=1.3",
{% endif %}
{% if cookiecutter.use_docker == "yes" %}
    "psycopg[binary]>=3.2",
{% endif %}
{% endif %}
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
{% if cookiecutter.project_type == "data_science" %}
    "jupyter>=1.1",
{% endif %}
{% if cookiecutter.use_ruff == "yes" %}
    "ruff>=0.6",
{% endif %}
{% if cookiecutter.use_mypy == "yes" %}
    "mypy>=1.11",
{% if cookiecutter.project_type == "data_science" %}
    "pandas-stubs>=2.2",
{% endif %}
{% if cookiecutter.project_type == "django" %}
    "django-stubs[compatible-mypy]>=5.1",
{% if cookiecutter.django_flavor == "drf" %}
    "djangorestframework-stubs>=3.15",
{% endif %}
{% endif %}
{% endif %}
{% if cookiecutter.use_bandit == "yes" %}
    "bandit>=1.7",
{% endif %}
{% if cookiecutter.use_pyscn == "yes" %}
    "pyscn>=0.1",
{% endif %}
{% if cookiecutter.use_conventional_commits == "yes" %}
    "pre-commit>=3.8",
{% endif %}
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/{{ cookiecutter.package_name }}"]
{% if cookiecutter.use_ruff == "yes" %}

[tool.ruff]
line-length = 100
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
{% if cookiecutter.project_type == "django" %}

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
{% endif %}
{% endif %}
{% if cookiecutter.use_mypy == "yes" %}

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
files = ["src", "tests"]
{% if cookiecutter.project_type == "django" and cookiecutter.django_flavor == "drf" %}
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
{% elif cookiecutter.project_type == "django" %}
plugins = ["mypy_django_plugin.main"]
{% endif %}
{% if cookiecutter.project_type == "fastapi" and cookiecutter.use_docker == "yes" %}

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
{% endif %}
{% if cookiecutter.project_type == "django" %}

[tool.django-stubs]
django_settings_module = "config.settings.dev"
{% endif %}
{% endif %}
{% if cookiecutter.use_bandit == "yes" %}

[tool.bandit]
exclude_dirs = ["tests"]
{% endif %}
