[project]
name = "python-cookiecutter"
version = "0.1.0"
description = "Cookiecutter template for Python projects (data science, FastAPI, Django)."
requires-python = ">=3.11"
dependencies = [
    "cookiecutter>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
